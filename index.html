<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bullet Hell: ดาวตกสีคราม</title>
<style>
:root{--bg:#0e1020;--ink:#eef0ff;--accent:#ff4f7b;--cyan:#5ee7ff;--panel:#181b33;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0e1020;--ink:#eef0ff}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#wrap{position:relative;width:min(100vw,calc((100vh - 24px)*0.75));aspect-ratio:3/4}
canvas{width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 0%,#1d2150,#0a0b18);border:2px solid #2b2f5e;border-radius:10px}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(8,9,20,.82);border-radius:10px;padding:16px}
#ov h1{margin:0 0 8px;font-size:clamp(24px,6vw,38px);color:var(--cyan)}
#ov p{margin:4px 0;font-size:clamp(14px,3.2vw,17px);line-height:1.5;max-width:30ch}
button{margin-top:16px;font:inherit;font-size:18px;padding:10px 28px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
#up,#ad,#pa{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(8,9,20,.86);border-radius:10px;padding:16px}
#up h2,#ad h2,#pa h2{margin:0 0 6px;color:var(--cyan);font-size:clamp(20px,5vw,28px)}
#up button,#ad button,#pa button{margin:0;width:min(280px,80%);background:var(--panel);border:2px solid var(--cyan);font-size:clamp(16px,4vw,20px)}
#up button:disabled{opacity:.4;border-color:#444;cursor:default}
#ad{overflow:auto}
#ad input{font:inherit;font-size:20px;padding:8px 12px;border-radius:8px;border:2px solid var(--cyan);background:var(--panel);color:var(--ink);text-align:center;width:min(240px,70%)}
#pz{position:absolute;top:2px;right:2px;width:28px;height:28px;padding:0;margin:0;border-radius:6px;background:#0e1020aa;border:1px solid var(--cyan);font-size:13px;line-height:1;z-index:5;display:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="640" aria-label="พื้นที่เล่นเกม"></canvas>
<div id="ov">
<h1 id="t">ดาวตกสีคราม</h1>
<p id="m">เคลื่อนที่ด้วยปุ่มลูกศร / WASD หรือลากนิ้วบนจอ<br>ยิงอัตโนมัติ · กด Shift เพื่อเคลื่อนที่ช้า<br>จุดสีขาวคือจุดโดนจริงของคุณ<br>ทำแต้มให้ถึงเกณฑ์เพื่อเรียกบอส<br>แต้มถึงเกณฑ์จะได้เลือกอัปเกรดยาน<br>Boss Rush: สู้บอสต่อเนื่องอย่างเดียว ชนะแต่ละตัวได้อัปเกรดและชีวิตเพิ่ม</p>
<button id="b">โหมดปกติ</button>
<button id="b2">Boss Rush</button>
<button id="b3" style="background:#333a6b;font-size:14px;padding:6px 16px">ผู้ดูแลระบบ</button>
</div>
<div id="up"></div>
<div id="ad"></div>
<div id="pa"><h2>หยุดชั่วคราว</h2><button id="pr">เล่นต่อ</button><button id="pm">กลับเมนูหลัก</button></div>
<button id="pz" title="หยุดเกม">⏸</button>
</div>
<script>
(function(){
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=480,H=640;
const upBox=document.getElementById('up'),ov=document.getElementById('ov'),bt=document.getElementById('b'),tt=document.getElementById('t'),mm=document.getElementById('m');
let best=[0,0];try{best=[+localStorage.getItem('bh_best')||0,+localStorage.getItem('bh_best_rush')||0]}catch(e){}
let P,B,E,S,EB,PF,ZN=[],score,lives,t,run,boss,keys={},touch=null,shake=0,bossAt=1500,bossN=0,warn=0,win=0,segStart=0,lvD=0,lvR=0,lvS=0,upAt=800,upN=0,pick=false,rush=false,adm=-1,paused=false,kills=0,bf=0,bfT=0;
function reset(){P={x:W/2,y:H-80,inv:0};B=[];E=[];EB=[];PF=[];ZN=[];score=0;lives=3;t=0;boss=null;run=true;bossAt=rush?0:1500;bossN=0;warn=0;win=0;segStart=0;lvD=0;lvR=0;lvS=0;upAt=rush?1e9:800;upN=0;pick=false;kills=0;bf=0;bfT=0;paused=false}
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.startsWith('Arrow'))e.preventDefault();if(e.key==='p'||e.key==='P'||e.key==='Escape')togglePause()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointerdown',e=>{touch=pos(e);touch.px=touch.x;touch.py=touch.y;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!touch)return;const p=pos(e);P.x+=p.x-touch.x;P.y+=p.y-touch.y;touch.x=p.x;touch.y=p.y});
cv.addEventListener('pointerup',()=>touch=null);
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;PF.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:30,c})}}
function shoot(x,y,a,s,c,r){s*=1+Math.min(.5,score/12000);EB.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c:c||'#ff4f7b',r:r||5})}
function ang(e){return Math.atan2(P.y-e.y,P.x-e.x)}
function openUp(){
  const L=[['ดาเมจกระสุน',lvD,5],['อัตรายิง',lvR,4],['จำนวนกระสุน',lvS,5]];
  if(L.every(x=>x[1]>=x[2])){upAt=1e9;return}
  pick=true;keys={};
  upBox.innerHTML='<h2>อัปเกรดยาน</h2>';
  L.forEach((x,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+x[0]+' (Lv '+x[1]+'/'+x[2]+')';b.disabled=x[1]>=x[2];b.onclick=()=>choose(i);upBox.appendChild(b)});
  upBox.style.display='flex';
}
function choose(i){
  if(i===0)lvD++;else if(i===1)lvR++;else lvS++;
  upN++;upAt=rush?1e9:score+800+upN*400;pick=false;upBox.style.display='none';keys={};
}
addEventListener('keydown',e=>{
  if(!pick)return;const i='123'.indexOf(e.key),mx=[5,4,5],cur=[lvD,lvR,lvS];
  if(i>=0&&cur[i]<mx[i])choose(i);
});
function spawn(){
  if(boss)return;
  if(warn>0){warn--;if(warn===0){const hp=360+bossN*150;boss={x:W/2,y:-60,hp:hp,max:hp,tx:W/2,f:0,kind:adm>=0?adm:bossN%9,ar:0,arm:0};if(boss.kind===1)boss.ar=boss.arm=hp;EB=[];E=[]}return}
  if(score>=bossAt&&!(rush&&score>=upAt)){warn=150;return}
  if(rush)return;
  if(t%Math.max(24,50-Math.floor(score/300))===0){
    const pool=['a','a','b'];if(score>=300)pool.push('c');if(score>=1000)pool.push('d');if(score>=2500)pool.push('e');if(score>=4500)pool.push('f');
    let k=pool[Math.random()*pool.length|0];const x=40+Math.random()*(W-80);
    if('cdf'.includes(k)&&E.filter(q=>q.k===k).length>=2)k='a';
    E.push({x,y:-20,hp:{a:3,b:5,c:8,d:10,e:6,f:9}[k]+Math.floor(score/3000),k,vx:k==='b'?(x<W/2?1:-1)*.8:0,vy:k==='a'?1.4:.9,f:0,ty:60+Math.random()*140})
  }
}
function updNew(e){
  e.f++;
  if(e.k==='d'){
    if(e.y<e.ty)e.y+=1.5;else{e.x+=Math.sin(e.f*.02);if(e.f%6===0){const a=e.f*.11;shoot(e.x,e.y,a,2.2,'#6dd5ff',4);shoot(e.x,e.y,a+3.14,2.2,'#6dd5ff',4)}if(e.f>420)e.y+=2}
  }else if(e.k==='f'){
    if(e.y<e.ty)e.y+=1.2;else{if(!e.vx)e.vx=e.x<W/2?.7:-.7;e.x+=e.vx;if(e.x<30||e.x>W-30)e.vx*=-1;if(e.f%70===0)EB.push({x:e.x,y:e.y,vx:(P.x-e.x)*.004,vy:1.2,c:'#ffd84f',r:7,fz:70});if(e.f>500)e.y+=2}
  }else{
    if(!e.s){e.y+=1.5;if(e.y>=e.ty){e.s=1;e.t=0}}
    else if(e.s===1){e.a=ang(e);if(++e.t>50){e.s=2;for(let i=-2;i<=2;i++)shoot(e.x,e.y,e.a+i*.3,2.4,'#ff5c5c',4)}}
    else{e.x+=Math.cos(e.a)*5.5;e.y+=Math.sin(e.a)*5.5}
  }
}
const bomb=(x,y,vx,vy,fz,n)=>EB.push({x,y,vx,vy,c:'#ffd84f',r:7,fz,n});
const dsh=(b,sp)=>{b.dm=1;b.x=Math.max(40,Math.min(W-40,b.x+Math.cos(b.da)*sp));b.y=Math.max(40,Math.min(H-60,b.y+Math.sin(b.da)*sp));if(b.pf%2===0)EB.push({x:b.x,y:b.y,vx:0,vy:0,c:'#ff8c42',r:6,lf:150});if(P.inv===0&&Math.hypot(P.x-b.x,P.y-b.y)<36)hit()};
const PAT={
  pin:(b,f,h)=>{if(f%(h?3:4)===0){const n=4+h*2;for(let i=0;i<n;i++)shoot(b.x,b.y,f*.05+i*6.2832/n,2.3,'#ffd84f',4)}},
  flower:(b,f,h)=>{if(f%24===0){const n=16+h*6;for(let i=0;i<n;i++)shoot(b.x,b.y,i/n*6.2832+(f/24%2)*.2,2.2,'#ff8fc7',5)}},
  burst:(b,f,h)=>{if(f%(h?8:12)===0){const a=ang(b);for(let i=-2;i<=2;i++)shoot(b.x,b.y,a+i*.18,3,'#fff',4)}},
  wave:(b,f,h)=>{if(f%2===0){const s=Math.sin(f*.08)*.9;shoot(b.x,b.y,1.5708+s,2.7,'#6dd5ff',4);shoot(b.x,b.y,1.5708-s,2.7,'#6dd5ff',4);if(h)shoot(b.x,b.y,1.5708+Math.sin(f*.05)*1.2,3,'#6dd5ff',4)}},
  curtain:(b,f,h)=>{if(f%24===0){const sp=h?30:36,o=(f/24%2)*sp/2;for(let x=o;x<W;x+=sp)if(Math.abs(x-P.x)>22)shoot(x,0,1.5708,2.4,'#b388ff',5)}},
  cross:(b,f,h)=>{if(f%14===0)for(const c of(h?[[0,0],[W,0],[0,H],[W,H]]:[[0,0],[W,0]]))shoot(c[0],c[1],Math.atan2(P.y-c[1],P.x-c[0]),3,'#ff5c5c',5)},
  carpet:(b,f,h)=>{if(f%12===0)bomb(Math.random()*W,b.y+20,0,1.4,50+(Math.random()*60|0),12+h*4)},
  lob:(b,f,h)=>{if(f%40===0){const a=ang(b);bomb(b.x,b.y,Math.cos(a)*2.2,Math.sin(a)*2.2,45,16+h*6)}},
  mines:(b,f,h)=>{if(f%20===0){let x,y,k=0;do{x=40+Math.random()*(W-80);y=80+Math.random()*(H-200)}while(Math.hypot(x-P.x,y-P.y)<90&&++k<20);bomb(x,y,0,0,90,10+h*4)}},
  dash:(b,f,h)=>{
    if(f<30){b.dm=1;b.ds=1;if(f<20)b.da=ang(b)}
    else if(f<55){dsh(b,10+h*3)}
    else if(f<65){b.dm=1;if(f===56)for(let i=0;i<12+h*6;i++)shoot(b.x,b.y,i/(12+h*6)*6.2832,2.4,'#ff8c42',4)}
    else if(f<85){b.dm=1;b.ds=1;if(f<75)b.da=ang(b)}
    else if(f<110){dsh(b,10+h*3)}
    else if(f<150){b.dm=1;b.x+=(W/2-b.x)*.08;b.y+=(110-b.y)*.08}
    
  },
  shotgun:(b,f,h)=>{if(f%32===0){const a=ang(b),n=6+h*3;for(let i=-n;i<=n;i++)shoot(b.x,b.y,a+i*.1,2+Math.random()*2,'#ff8c42',4)}},
  seekers:(b,f,h)=>{if(f%36===0){const n=7+h*3;for(let i=0;i<n;i++){const a=i/n*6.2832;EB.push({x:b.x,y:b.y,vx:Math.cos(a)*2.6,vy:Math.sin(a)*2.6,c:'#9be564',r:8,hm:1,fz:95,sm:1})}}},
  echo:(b,f,h)=>{(b.hist=b.hist||[]).push([P.x,P.y]);if(b.hist.length>30)b.hist.shift();if(f%(h?4:6)===0){const o=b.hist[0];shoot(b.x,b.y,Math.atan2(o[1]-b.y,o[0]-b.x),3.4,'#9be564',5)}if(f%20===0)shoot(b.x,b.y,ang(b),3.2,'#fff',4)},
  hunters:(b,f,h)=>{if(f%28===0)for(const x of(h?[0,W,W/2,W/4,W*.75]:[0,W,W/2]))EB.push({x,y:0,vx:x<W/2?2:x>W/2?-2:0,vy:2.2,c:'#9be564',r:8,hm:1,fz:110,sm:1})},
  collapse:(b,f,h)=>{
    
    if(f%40===1){const n=40+h*12,ga=Math.atan2(P.y-b.y,P.x-b.x)+(Math.random()-.5)*1.2;
      for(let i=0;i<n;i++){const a=i/n*6.2832;if(Math.abs(Math.atan2(Math.sin(a-ga),Math.cos(a-ga)))<.3)continue;const x=b.x+Math.cos(a)*330,y=b.y+Math.sin(a)*330;if(y>H+10)continue;shoot(x,y,a+Math.PI,1.6,'#b388ff',4);EB[EB.length-1].gr=220;EB[EB.length-1].sink=1}
      for(let i=0;i<14+h*6;i++){const a2=i/(14+h*6)*6.2832;shoot(b.x+Math.cos(a2)*34,b.y+Math.sin(a2)*34,a2+f*.01,2,'#7ad7ff',4)}}
  },
  zones:(b,f,h)=>{if(f%50===1){for(let i=0;i<3+h;i++){const x=i?Math.random()*(W-56):Math.max(0,Math.min(W-56,P.x-28));ZN.push({x,y:0,w:56,h:H,t:0})}if(h)ZN.push({x:0,y:Math.max(0,Math.min(H-56,P.y-28)),w:W,h:56,t:0})}},
  ricochet:(b,f,h)=>{if(f%(h?8:12)===0){const a=ang(b)+(Math.random()-.5)*1.4;EB.push({x:b.x,y:b.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,c:'#7ad7ff',r:5,bn:h?3:2})}},
  tide:(b,f,h)=>{if(f%(h?6:8)===0){const y=50+(Math.sin(f*.07)*.5+.5)*(H-200);shoot(0,y,0,2.6,'#6dd5ff',4);shoot(W,H-y-100,Math.PI,2.6,'#6dd5ff',4)}},
  giant:(b,f,h)=>{if(f%70===1){const a=ang(b);EB.push({x:b.x,y:b.y,vx:Math.cos(a)*2,vy:Math.sin(a)*2,c:'#ff7a3a',r:16,fz:80,n:30+h*10,big:1})}},
  slam:(b,f,h)=>{
    if(f<45){b.dm=1;b.x+=(P.x-b.x)*.1;b.y+=(60-b.y)*.1;b.ds=3}
    else if(f<75){b.dm=1;b.ds=3}
    else if(f<97){b.dm=1;b.y+=(H-60-b.y)*.2;if(P.inv===0&&Math.hypot(P.x-b.x,P.y-b.y)<40)hit()}
    else if(f<130){b.dm=1;if(f===97){shake=14;for(let j=0;j<4+h*2;j++){shoot(b.x,H-60-j*26,0,3,'#ffd84f',5);shoot(b.x,H-60-j*26,Math.PI,3,'#ffd84f',5)}for(let i=0;i<10;i++)shoot(b.x,b.y,-Math.PI*(i+.5)/10,2.4,'#ff8c42',4)}}
    else if(f<170){b.dm=1;b.x+=(W/2-b.x)*.08;b.y+=(110-b.y)*.08}
  }
};
const SEQ=[[['pin',140],['burst',100],['flower',140]],[['wave',150],['curtain',150],['tide',140],['cross',120]],[['carpet',140],['lob',120],['giant',160],['mines',120]],[['dash',150],['shotgun',100],['slam',175],['dash',150]],[['seekers',150],['echo',120],['hunters',150]],[['collapse',160],['zones',150],['ricochet',130]]];
function updB3(b,p){
  const S=SEQ[b.kind-3];if(!b.pf&&b.y<(b.kind===8?H/2:110))return;b.dm=0;b.ds=0;b.pf=(b.pf||0)+1;b.pi=b.pi||0;
  const q=S[b.pi%S.length];
  if(b.pf>q[1]+30){b.pf=0;b.pi++;return}
  if(b.pf<=q[1])PAT[q[0]](b,b.pf,b.ph2?1:0);
}
function bossHit(d){
  if(boss.ar>0){boss.ar-=d;if(boss.ar<=0){boss.ar=0;shake=10;if(boss.kind===1&&!boss.ph2){boss.ph2=1;boss.pt=100;EB=[];ZN=[];shake=25}}}
  else boss.hp-=d;
}
function updB1(b,p){
  const f=b.f,iv=Math.max(40,(b.ph3?54:b.ph2?64:84)-bossN*2),sg=f%320<130,sk=f%320>=165&&f%320<265;
  if(sg&&(f%iv===0||(b.ph3&&f%iv===(iv>>1)))){b.gx=Math.max(70,Math.min(W-70,(b.gx===undefined?P.x:b.gx)+(Math.random()-.5)*2*(b.ph3?70:b.ph2?150:200)));const gh=b.ph3?44:b.ph2?52:60,sp=b.ph3?2.8:b.ph2?2.6:2.3;for(let x=16;x<W;x+=26)if(Math.abs(x-b.gx)>gh)shoot(x,b.y+24,1.5708,sp,'#2fb8a0',5)}
  if(sk){b.gx=undefined;if(f%16===0){const gx=W/2+Math.sin(f*(b.ph3?.024:b.ph2?.02:.016))*160,gh=b.ph3?46:b.ph2?52:62;for(let x=12;x<W;x+=24)if(Math.abs(x-gx)>gh)shoot(x,b.y+24,1.5708,2.2,'#7affd8',4)}}
  if(f%(b.ph3?36:b.ph2?46:56)===0){const a=ang(b),n=b.ph3?3:b.ph2?2:1;for(let i=-n;i<=n;i++)shoot(b.x,b.y,a+i*.2,3,'#7affd8',4)}
  if(b.ph2&&f%26===0){shoot(30,b.y,ang({x:30,y:b.y}),2.7,'#7affd8',4);shoot(W-30,b.y,ang({x:W-30,y:b.y}),2.7,'#7affd8',4)}
  if((b.ph3&&f%9===0)||(b.ph2&&f%24===0))shoot(Math.random()*W,0,1.5708,2.5,'#fff',3);
}
function updB2(b,p){
  const T=b.ph2?200:230,q=b.f%T,n=b.ph2?5:4;b.n=n;
  b.laser=q<70?1:q<95?3:q<150?2:0;
  if(q<70)b.a0=ang(b);
  if(b.laser===2){
    b.a0+=(p<.25?.025:.016)*(b.f%(2*T)<T?1:-1);
    if(P.inv===0)for(let i=0;i<n;i++){const a=b.a0+i*6.2832/n,dx=P.x-b.x,dy=P.y-b.y;if(dx*Math.cos(a)+dy*Math.sin(a)>0&&Math.abs(dx*Math.sin(a)-dy*Math.cos(a))<10){hit();break}}
  }
  if(b.laser===2&&q%(b.ph2?5:10)===0)shoot(b.x,b.y,q*.2,2.4,'#ffd84f',4);
  if(q>=150&&q%14===0)for(let i=0;i<14;i++)shoot(b.x,b.y,i/14*6.28+q*.1,2.4,'#c0392b',5);
}
function updLaser(e){
  e.f++;
  if(e.y<e.ty){e.y+=1.6;return}
  e.c=(e.c||0)+1;
  if(e.c>=400){e.y+=2.5;e.laser=0;return}
  const p=e.c%200;
  e.laser=p<100?1:p<130?3:p<170?2:0;
  if(p<100)e.a=ang(e);
  if(e.laser===2&&P.inv===0){
    const dx=P.x-e.x,dy=P.y-e.y,s=Math.sin(e.a),c=Math.cos(e.a);

  g.fillStyle='#eef0ff';g.font='16px sans-serif';g.textBaseline='top';

let last=0,acc=0;
function loop(ts){
  const d=Math.min(100,ts-last);last=ts;acc+=d;
  while(acc>=16.67){if(run&&!pick&&!paused)step();acc-=16.67}
  if(P)draw();
  requestAnimationFrame(loop);
}
